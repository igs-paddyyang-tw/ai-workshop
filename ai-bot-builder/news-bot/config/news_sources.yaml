tw_game_keywords:
  - "包你發"
  - "老子有錢"
  - "星城"
  - "豪神"
  - "明星三缺一"
  - "明星3缺1"
  - "神來也麻將"
  - "哩咕麻將"
  - "天狐宴"
  - "金爸爸"
  - "滿貫大亨"
  - "博弈"
  - "老虎機"
  - "捕魚"
  - "麻將"
  - "柏青哥"
  - "柏青斯洛"
  - "德州撲克"
  - "AppStore"
  - "GooglePlay"

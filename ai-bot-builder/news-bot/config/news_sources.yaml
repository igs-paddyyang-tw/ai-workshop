# 科技日報來源配置
sources:
  # ─── RSS 來源（最穩定）───────────────────
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    type: rss
    category: ai_focus

  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/technology-lab"
    type: rss
    category: dev_tools

  # ─── HTML 來源 ─────────────────────────────
  - name: "Hacker News"
    url: "https://news.ycombinator.com/"
    type: html
    selector: ".titleline a"
    category: tech_general

# ─── 台灣遊戲情報來源（獨立區塊）─────────────────
game_sources:
  # ─── RSS 來源 ───────────────────────────────
  - name: "巴哈姆特 GNN"
    url: "https://gnn.gamer.com.tw/rss.xml"
    type: rss
    category: tw_game

  - name: "巴哈姆特 GNN 手機遊戲"
    url: "https://gnn.gamer.com.tw/rss.xml?k=4"
    type: rss
    category: tw_game

  - name: "4Gamers 新聞"
    url: "https://www.4gamers.com.tw/rss/latest-news"
    type: rss
    category: tw_game

  # ─── 博弈手遊官網（HTML 爬取）────────────────
  - name: "星城Online 官網公告"
    url: "https://www.xin-stars.com/"
    type: html
    selector: ".newsList a"
    category: tw_game

  - name: "豪神娛樂城 官網"
    url: "https://hs-casino.com/"
    type: html
    selector: "a"
    category: tw_game

# ─── 台灣博弈手遊品牌關注清單 ─────────────────

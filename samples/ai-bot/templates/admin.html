<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ AI Bot — Admin</title>
<style>
:root { --bg: #0f172a; --surface: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #22d3ee; --green: #4ade80; --yellow: #fbbf24; --red: #f87171; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.2rem; color: var(--accent); }
header nav a { color: var(--muted); text-decoration: none; margin-left: 1rem; font-size: 0.9rem; }
header nav a:hover { color: var(--accent); }
header nav a.active { color: var(--accent); }

.container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
h2 { color: var(--accent); font-size: 1.3rem; margin: 1.5rem 0 0.8rem; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1rem 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; }
.card .label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
.card .value { font-size: 1.5rem; font-weight: 700; }
.card .value.green { color: var(--green); }
.card .value.yellow { color: var(--yellow); }
.card .value.accent { color: var(--accent); }

/* Table */
table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
th, td { border: 1px solid var(--border); padding: 0.6rem 0.8rem; text-align: left; font-size: 0.9rem; }
th { background: var(--surface); color: var(--accent); }
tr:nth-child(even) { background: rgba(30,41,59,0.5); }

/* Status dot */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; }
.dot.online { background: var(--green); }
.dot.offline { background: var(--red); }

/* Buttons */
.btn { padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.8rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }

/* Log */
.log { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>⚙️ AI Bot — Admin</h1>
  <nav>
    <a href="/">💬 Chat</a>
    <a href="/admin" class="active">⚙️ Admin</a>
    <a href="/api-docs">📖 API</a>
  </nav>
</header>

<div class="container">

  <h2>📊 系統狀態</h2>
  <div class="cards" id="statsCards">
    <div class="card"><div class="label">Agent 數量</div><div class="value accent" id="agentCount">-</div></div>
    <div class="card"><div class="label">Skills</div><div class="value green" id="skillCount">-</div></div>
    <div class="card"><div class="label">知識庫</div><div class="value yellow" id="wikiCount">-</div></div>
    <div class="card"><div class="label">Wiki 健康度</div><div class="value green" id="wikiHealth">-</div></div>
  </div>

  <h2>🤖 Agent 列表</h2>
  <table id="agentTable">
    <thead><tr><th>Agent</th><th>SOUL</th><th>Skills</th><th>Knowledge</th></tr></thead>
    <tbody id="agentBody"></tbody>
  </table>

  <h2>📚 知識庫（全域）</h2>
  <div style="margin-bottom: 0.5rem;">
    <button class="btn primary" onclick="doIngest()">⬆️ Ingest（匯入 raw/ → wiki/）</button>
    <button class="btn" onclick="doLint()">🔍 Lint（健康檢查）</button>
  </div>
  <table id="wikiTable">
    <thead><tr><th>檔案</th><th>位置</th></tr></thead>
    <tbody id="wikiBody"></tbody>
  </table>

  <h2>📋 操作日誌</h2>
  <div class="log" id="logArea">載入中...</div>

</div>

<script>
async function loadStats() {
  // Skills
  try {
    const resp = await fetch('/api/v1/skills');
    const data = await resp.json();
    document.getElementById('skillCount').textContent = data.skills.length;
  } catch(e) { document.getElementById('skillCount').textContent = '?'; }

  // Wiki lint
  try {
    const resp = await fetch('/api/v1/wiki/lint');
    const data = await resp.json();
    document.getElementById('wikiHealth').textContent = data.healthy ? '✅' : `⚠️ ${data.issues.length}`;
  } catch(e) { document.getElementById('wikiHealth').textContent = '?'; }
}

async function loadAgents() {
  const agents = ['admin', 'pm', 'ai-dev', 'coder', 'qa', 'data', 'market', 'report'];
  const emojis = {'admin':'👑','pm':'📋','ai-dev':'🧠','coder':'💻','qa':'🧪','data':'📊','market':'🗺️','report':'📝'};
  document.getElementById('agentCount').textContent = agents.length;

  const tbody = document.getElementById('agentBody');
  tbody.innerHTML = agents.map(a => {
    return `<tr>
      <td><span class="dot online"></span>${emojis[a] || '🤖'} ${a}-agent</td>
      <td>agents/${a}-agent/.kiro/steering/SOUL.md</td>
      <td>agents/${a}-agent/skills/</td>
      <td>agents/${a}-agent/knowledge/raw/</td>
    </tr>`;
  }).join('');
}

async function loadWiki() {
  const files = ['ocean-king-analysis.md', 'super-ace-analysis.md', 'fishing-vs-slot-comparison.md'];
  document.getElementById('wikiCount').textContent = `${files.length} 篇`;

  const tbody = document.getElementById('wikiBody');
  tbody.innerHTML = '';
  // raw
  files.forEach(f => {
    tbody.innerHTML += `<tr><td>📄 ${f}</td><td>knowledge/raw/</td></tr>`;
  });
}

async function loadLog() {
  try {
    const resp = await fetch('/api/v1/wiki/lint');
    document.getElementById('logArea').textContent = '系統正常運行中。\n使用 Ingest 按鈕匯入知識，或透過 API 操作。';
  } catch(e) {
    document.getElementById('logArea').textContent = `錯誤: ${e.message}`;
  }
}

async function doIngest() {
  try {
    const resp = await fetch('/api/v1/wiki/ingest', { method: 'POST' });
    const data = await resp.json();
    alert(`✅ 匯入完成：${data.count} 篇\n${data.ingested.join(', ')}`);
    loadWiki();
    loadStats();
  } catch(e) { alert(`❌ 錯誤: ${e.message}`); }
}

async function doLint() {
  try {
    const resp = await fetch('/api/v1/wiki/lint');
    const data = await resp.json();
    if (data.healthy) {
      alert('✅ Wiki 健康！沒有問題。');
    } else {
      alert(`⚠️ ${data.issues.length} 個問題：\n${JSON.stringify(data.issues, null, 2)}`);
    }
  } catch(e) { alert(`❌ 錯誤: ${e.message}`); }
}

// 初始化
loadStats();
loadAgents();
loadWiki();
loadLog();
</script>

</body>
</html>

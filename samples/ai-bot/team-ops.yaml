# ═══════════════════════════════════════════════════════
# 營運團隊（Operations Team）— 本地模式
# 用途：市場監控 + 數據分析 + 報告產出
# 啟用：cp team-ops.yaml team.yaml && python start.py
# ═══════════════════════════════════════════════════════

name: "營運團隊"

instances:
  admin-agent:
    working_directory: agents/admin-agent
    role: admin
    description: "系統管理、監控、設定調整"

  pm-agent:
    working_directory: agents/pm-agent
    role: leader
    description: "需求分析、任務派工、進度追蹤"

  market-agent:
    working_directory: agents/market-agent
    role: worker
    description: "社群輿情、競品監控、產業新聞爬取"

  data-agent:
    working_directory: agents/data-agent
    role: worker
    description: "內部營運數據分析、趨勢洞察、KPI 追蹤"

  report-agent:
    working_directory: agents/report-agent
    role: worker
    description: "Markdown/HTML 報告產出、圖表渲染、定期摘要"

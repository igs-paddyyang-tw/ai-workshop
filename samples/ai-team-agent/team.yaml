# ═══════════════════════════════════════════════════════
# 營運團隊（Operations Team）
# 用途：市場監控 + 數據分析 + 報告產出
# 啟用：cp team-ops.yaml team.yaml && python start.py
# ═══════════════════════════════════════════════════════

channel:
  bot_token_env: TELEGRAM_BOT_TOKEN
  # group_id: -100xxxxxxxxxx    # 有值 = Group Topics；無值 = 純私聊
  # general_topic_id: 4

access:
  mode: locked
  allowed_users: []              # 填入你的 Telegram user_id

defaults:
  backend: kiro-cli
  model: auto

cost_guard:
  daily_limit_usd: 15.0
  warn_at_percentage: 80
  timezone: Asia/Taipei

hang_detector:
  enabled: true
  timeout_minutes: 60
  escalation_minutes: 180

instances:
  admin-agent:
    working_directory: agents/admin-agent
    description: "⚙️ 管理者 — 服務監控、重啟、成本控制"
    role: admin
    skip_resume: true

  pm-agent:
    working_directory: agents/pm-agent
    description: "🧠 專案經理 — 需求分析、派工、驗收"
    role: leader
    skip_resume: true

  market-agent:
    working_directory: agents/market-agent
    description: "📰 市場研究員 — 社群輿情、競品監控、產業新聞爬取"
    role: worker
    skip_resume: true

  data-agent:
    working_directory: agents/data-agent
    description: "📊 數據分析師 — 內部營運數據分析、趨勢洞察、KPI 追蹤"
    role: worker
    skip_resume: true

  report-agent:
    working_directory: agents/report-agent
    description: "📋 報告專員 — Markdown/HTML 報告產出、圖表渲染、定期摘要"
    role: worker
    skip_resume: true

health_port: 13030

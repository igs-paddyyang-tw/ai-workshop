# ═══════════════════════════════════════════════════════════════
# team.yaml —— 團隊設定（唯一集中點）
#
# 啟動：.venv/bin/python start.py
# 設定分工：team.yaml（誰/怎麼跑）· scheduler.yaml（何時）· .env（機密）
#
# 🔴 **這份檔案就是架構。** 套件化之後，runtime / A2A / Kanban / REST /
#    排程 / 決策路由全在 ark_team_agent 裡 —— 人要做的是「定義」，不是「實作」。
#    第四堂讀的六個區塊：instances · group · access · cost_guard ·
#    hang_detector · kiro_files。
# ═══════════════════════════════════════════════════════════════

defaults:
  backend: kiro-cli
  model: auto
  persistent: true

# 知識庫查詢櫃順序（自有櫃 → 共用櫃）
knowledge_search_order: [shared]

# ── skill 與 steering 的覆寫政策 ────────────────────────────────
# 🔴 `skills.policy: skip` 不是選配 —— 不設的話套件**每次啟動**都會把
#    內建 skill 鋪回各 agent，推翻你用 sync_skills.py 定的角色矩陣。
kiro_files:
  skills:
    policy: skip
  steering:
    team_md: always      # 成員表以 team.yaml 為唯一真相，每次啟動重產
    soul_md: once        # 手寫人格不覆蓋（其實是預設；顯式寫出讓「不被蓋」一目了然）

channel:
  bot_token_env: TELEGRAM_BOT_TOKEN
  # group_id: -100xxxxxxxxxx      # TG 群組 id（建群後填）

access:
  mode: locked                    # locked | group | open
  allowed_users: []               # 🔴 填你自己的 Telegram user_id，否則誰都指揮不動

cost_guard:
  daily_limit_usd: 15.0
  warn_at_percentage: 80
  timezone: Asia/Taipei

hang_detector:
  enabled: true
  timeout_minutes: 60
  escalation_minutes: 180

startup:
  concurrency: 2
  stagger_delay_ms: 3000

# ═══════════════════════════════════════════════════════════════
# instances —— 誰在團隊
#
# 📌 **想跑精簡編制**：把不需要的 instance 整段註解掉即可。
#    營運 5 人 = admin + leader + market + data + report
#    研發 5 人 = admin + leader + ai-dev + coder + qa
#
# 🔴 worker 用 `group: <leader>` 指向所屬 leader（**不是** `group_members`
#    —— 那是 bot 端 agents.yaml 的寫法）。寫錯套件會**靜默忽略**，
#    只在 log 印一行「欄位不存在 → 已忽略」，派工歸屬不生效。
# ═══════════════════════════════════════════════════════════════
instances:
  # ── 維運（預設入口）──
  admin-agent:
    working_directory: agents/admin-agent
    description: "👑 Admin — 預設入口、服務監控、成本控制、發布維運"
    role: admin
    skip_resume: true

  # ── 統籌 ──
  leader-agent:
    working_directory: agents/leader-agent
    description: "🧠 Leader — 需求分析、任務拆解、派工、驗收彙整"
    role: leader
    skip_resume: true

  # ── 研發線（能改 code）──
  ai-dev-agent:
    working_directory: agents/ai-dev-agent
    description: "🤖 AI Dev — Prompt 設計、RAG、MCP 整合"
    role: worker
    group: leader-agent
    persistent: false             # 動態：需求觸發才啟動
    skip_resume: true

  coder-agent:
    working_directory: agents/coder-agent
    description: "💻 Coder — 全端開發、API 實作、資料庫設計"
    role: worker
    group: leader-agent
    persistent: false
    skip_resume: true

  qa-agent:
    working_directory: agents/qa-agent
    description: "🧪 QA — 測試、Code Review、反證驗收"
    role: worker
    group: leader-agent
    persistent: false
    skip_resume: true

  # ── 營運線（只讀不寫 code）──
  market-agent:
    working_directory: agents/market-agent
    description: "🗺️ Market — 市場研究、競品分析、社群輿情"
    role: worker
    group: leader-agent
    persistent: false
    skip_resume: true

  data-agent:
    working_directory: agents/data-agent
    description: "📊 Data — 數據分析、KPI 追蹤、趨勢洞察"
    role: worker
    group: leader-agent
    persistent: false
    skip_resume: true

  report-agent:
    working_directory: agents/report-agent
    description: "📝 Report — MD → HTML → TG 報告產出"
    role: worker
    group: leader-agent
    persistent: false
    skip_resume: true

# API / health 端點（健康檢查是 /api/health，**不是** /health）
# 💡 website（給人看的看板）會自動起在 health_port + 5000 → 28050
health_port: 23050

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>03-platform — Kanban Board</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft JhengHei",sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:1.5rem}
h1{font-size:1.4rem;margin-bottom:1.5rem;color:#22d3ee}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;min-height:70vh}
.column{background:#1e293b;border-radius:8px;padding:1rem;border-top:3px solid var(--col-color)}
.column h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.8rem;color:#94a3b8}
.card{background:#334155;border-radius:6px;padding:.7rem;margin-bottom:.6rem;font-size:.8rem;border-left:3px solid var(--col-color)}
.card .title{font-weight:600;margin-bottom:.3rem}
.card .meta{color:#64748b;font-size:.7rem}
.col-todo{--col-color:#94a3b8}
.col-ready{--col-color:#facc15}
.col-progress{--col-color:#3b82f6}
.col-review{--col-color:#a855f7}
.col-done{--col-color:#22c55e}
.stats{display:flex;gap:2rem;margin-bottom:1.5rem}
.stat{background:#1e293b;padding:.8rem 1.2rem;border-radius:6px}
.stat .val{font-size:1.5rem;font-weight:700;color:#22d3ee}
.stat .lbl{font-size:.7rem;color:#64748b;margin-top:.2rem}
</style>
</head>
<body>
<h1>📋 Platform Kanban Board</h1>
<div class="stats">
  <div class="stat"><div class="val">3</div><div class="lbl">Agents</div></div>
  <div class="stat"><div class="val">12</div><div class="lbl">Tasks</div></div>
  <div class="stat"><div class="val">67%</div><div class="lbl">完成率</div></div>
</div>
<div class="board">
  <div class="column col-todo"><h2>📥 Todo</h2>
    <div class="card"><div class="title">設計 Schema</div><div class="meta">admin • 低</div></div>
    <div class="card"><div class="title">整合測試</div><div class="meta">qa • 中</div></div>
  </div>
  <div class="column col-ready"><h2>🟡 Ready</h2>
    <div class="card"><div class="title">API 文件</div><div class="meta">dev • 中</div></div>
  </div>
  <div class="column col-progress"><h2>🔵 In Progress</h2>
    <div class="card"><div class="title">Dashboard UI</div><div class="meta">dev • 高</div></div>
    <div class="card"><div class="title">Bot 指令</div><div class="meta">admin • 高</div></div>
  </div>
  <div class="column col-review"><h2>🟣 Review</h2>
    <div class="card"><div class="title">權限系統</div><div class="meta">admin • 高</div></div>
  </div>
  <div class="column col-done"><h2>✅ Done</h2>
    <div class="card"><div class="title">Health API</div><div class="meta">dev • 低</div></div>
    <div class="card"><div class="title">Agent CRUD</div><div class="meta">dev • 中</div></div>
    <div class="card"><div class="title">Task CRUD</div><div class="meta">dev • 中</div></div>
  </div>
</div>
</body>
</html>
